name: taupkg Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            ext: ""
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            ext: ""
          - os: windows-latest
            platform: windows-x64
            ext: ".exe"
          - os: macos-latest
            platform: macos-arm64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout taupkg
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Download the latest tauraroc release for this platform.
      # The zip contains the full install:
      #   tauraroc-{platform}/
      #     tauraroc[.exe]
      #     runtime/tauraro_rt.h
      #     std/
      # The binary finds runtime/ and std/ relative to itself,
      # so we keep the extracted folder intact.
      # -------------------------------------------------------
      - name: Download latest tauraroc
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP="tauraroc-${{ matrix.platform }}.zip"

          # Resolve the latest release tag
          TAG=$(gh release view \
                  --repo tauraro/tauraro \
                  --json tagName \
                  -q '.tagName' 2>/dev/null || true)

          if [ -z "$TAG" ]; then
            echo "error: could not determine latest tauraroc release tag"
            exit 1
          fi
          echo "Latest tauraroc: $TAG"

          mkdir -p tauraroc-dl/
          gh release download "$TAG" \
            --repo tauraro/tauraro \
            --pattern "$ZIP" \
            --dir tauraroc-dl/ \
            --clobber

          # Extract — preserves the tauraroc-{platform}/ subfolder structure.
          # Use unzip on all platforms (available via Git Bash on Windows runners).
          # PowerShell Expand-Archive is a reliable fallback if unzip is absent.
          mkdir -p tauraroc-install/
          if unzip -oq "tauraroc-dl/$ZIP" -d tauraroc-install/ 2>/dev/null; then
            echo "==> Extracted with unzip"
          else
            echo "==> unzip failed, trying PowerShell Expand-Archive..."
            powershell -Command "Expand-Archive -Force \
              -Path 'tauraroc-dl/$ZIP' \
              -DestinationPath 'tauraroc-install/'"
          fi

          # Locate the binary inside the extracted folder
          BIN=$(find tauraroc-install -name "tauraroc${{ matrix.ext }}" \
                  ! -path "*/src/*" | head -1)
          if [ -z "$BIN" ]; then
            echo "error: tauraroc${{ matrix.ext }} not found in $ZIP"
            exit 1
          fi

          chmod +x "$BIN" 2>/dev/null || true

          # The runtime header lives next to the binary (runtime/tauraro_rt.h).
          # Export both the binary path and the runtime dir so the compiler finds
          # its headers even when invoked from a different working directory.
          BIN_DIR=$(dirname "$BIN")
          RT_DIR="$(pwd)/$BIN_DIR/runtime"

          # Export as Windows-native paths when on Windows runner
          if [ "$RUNNER_OS" = "Windows" ]; then
            TAURAROC=$(cygpath -w "$BIN")
            TAURAROC_RT=$(cygpath -w "$RT_DIR")
          else
            TAURAROC="$(pwd)/$BIN"
            TAURAROC_RT="$RT_DIR"
          fi

          echo "TAURAROC=$TAURAROC"         >> "$GITHUB_ENV"
          echo "TAURAROC_RT=$TAURAROC_RT"   >> "$GITHUB_ENV"
          echo "Using tauraroc: $TAURAROC"
          echo "Runtime dir:    $TAURAROC_RT"

      # -------------------------------------------------------
      # Compile taupkg.
      # tauraroc writes the binary to src/build/taupkg[.exe].
      # Entry point: src/main.tr  →  src/build/taupkg[.exe]
      # -------------------------------------------------------
      - name: Build taupkg (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          "$TAURAROC" src/main.tr -o taupkg

      - name: Build taupkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:TAURAROC" src\main.tr -o taupkg.exe

      # tauraroc puts the binary in src/build/ — move it to the repo root
      # (same pattern as the main tauraroc CI "Place binary at repo root" step).
      - name: Place binary at repo root
        shell: bash
        run: |
          if [ -f "src/build/taupkg${{ matrix.ext }}" ]; then
            mv "src/build/taupkg${{ matrix.ext }}" "./taupkg${{ matrix.ext }}"
          elif [ -f "taupkg${{ matrix.ext }}" ]; then
            echo "Binary already at repo root (compiler placed it directly)."
          else
            echo "error: taupkg${{ matrix.ext }} not found in src/build/ or current dir"
            ls -la src/build/ 2>/dev/null || true
            exit 1
          fi

      - name: Verify binary
        shell: bash
        run: |
          if [ -f "taupkg${{ matrix.ext }}" ]; then
            echo "Build succeeded: taupkg${{ matrix.ext }}"
            ls -lh "taupkg${{ matrix.ext }}"
            ./taupkg${{ matrix.ext }} version
          else
            echo "error: taupkg${{ matrix.ext }} not produced"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: taupkg-${{ matrix.platform }}
          path: taupkg${{ matrix.ext }}

  # -----------------------------------------------------------------
  # Release: runs only on v* tag pushes after all builds succeed.
  # Downloads each platform binary, zips it, creates a GitHub Release.
  # -----------------------------------------------------------------
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download linux-x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: taupkg-linux-x64
          path: release/linux-x64/

      - name: Download linux-arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: taupkg-linux-arm64
          path: release/linux-arm64/

      - name: Download windows-x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: taupkg-windows-x64
          path: release/windows-x64/

      - name: Download macos-arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: taupkg-macos-arm64
          path: release/macos-arm64/

      - name: Create release zips
        run: |
          mkdir -p release/assets
          zip -j release/assets/taupkg-linux-x64.zip   release/linux-x64/taupkg
          zip -j release/assets/taupkg-linux-arm64.zip release/linux-arm64/taupkg
          zip -j release/assets/taupkg-windows-x64.zip release/windows-x64/taupkg.exe
          zip -j release/assets/taupkg-macos-arm64.zip release/macos-arm64/taupkg

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "taupkg ${{ github.ref_name }}" \
            --generate-notes \
            release/assets/taupkg-linux-x64.zip \
            release/assets/taupkg-linux-arm64.zip \
            release/assets/taupkg-windows-x64.zip \
            release/assets/taupkg-macos-arm64.zip
