name: taupkg Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            ext: ""
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            ext: ""
          - os: windows-latest
            platform: windows-x64
            ext: ".exe"
          - os: macos-latest
            platform: macos-arm64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout taupkg
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Download the latest tauraroc release for this platform.
      # The zip contains the full install:
      #   tauraroc-{platform}/
      #     tauraroc[.exe]
      #     runtime/tauraro_rt.h
      #     std/
      # The binary finds runtime/ and std/ relative to itself,
      # so we keep the extracted folder intact.
      # -------------------------------------------------------
      - name: Download latest tauraroc
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP="tauraroc-${{ matrix.platform }}.zip"

          # Resolve the latest release tag
          TAG=$(gh release view \
                  --repo tauraro/tauraro \
                  --json tagName \
                  -q '.tagName' 2>/dev/null || true)

          if [ -z "$TAG" ]; then
            echo "error: could not determine latest tauraroc release tag"
            exit 1
          fi
          echo "Latest tauraroc: $TAG"

          mkdir -p tauraroc-dl/
          gh release download "$TAG" \
            --repo tauraro/tauraro \
            --pattern "$ZIP" \
            --dir tauraroc-dl/ \
            --clobber

          # Extract — preserves the tauraroc-{platform}/ subfolder structure.
          # Use unzip on all platforms (available via Git Bash on Windows runners).
          # PowerShell Expand-Archive is a reliable fallback if unzip is absent.
          mkdir -p tauraroc-install/
          if unzip -oq "tauraroc-dl/$ZIP" -d tauraroc-install/ 2>/dev/null; then
            echo "==> Extracted with unzip"
          else
            echo "==> unzip failed, trying PowerShell Expand-Archive..."
            powershell -Command "Expand-Archive -Force \
              -Path 'tauraroc-dl/$ZIP' \
              -DestinationPath 'tauraroc-install/'"
          fi

          # Locate the binary inside the extracted folder
          BIN=$(find tauraroc-install -name "tauraroc${{ matrix.ext }}" \
                  ! -path "*/src/*" | head -1)
          if [ -z "$BIN" ]; then
            echo "error: tauraroc${{ matrix.ext }} not found in $ZIP"
            exit 1
          fi

          chmod +x "$BIN" 2>/dev/null || true

          # The runtime header lives next to the binary (runtime/tauraro_rt.h).
          # Export both the binary path and the runtime dir so the compiler finds
          # its headers even when invoked from a different working directory.
          BIN_DIR=$(dirname "$BIN")
          RT_DIR="$(pwd)/$BIN_DIR/runtime"

          # Export as Windows-native paths when on Windows runner
          if [ "$RUNNER_OS" = "Windows" ]; then
            TAURAROC=$(cygpath -w "$BIN")
            TAURAROC_RT=$(cygpath -w "$RT_DIR")
          else
            TAURAROC="$(pwd)/$BIN"
            TAURAROC_RT="$RT_DIR"
          fi

          echo "TAURAROC=$TAURAROC"         >> "$GITHUB_ENV"
          echo "TAURAROC_RT=$TAURAROC_RT"   >> "$GITHUB_ENV"
          echo "Using tauraroc: $TAURAROC"
          echo "Runtime dir:    $TAURAROC_RT"

      # -------------------------------------------------------
      # Build directly: v0.0.5 tauraroc finds its own runtime
      # header and std/ relative to the install dir, and invokes
      # the C compiler itself. A bare `-o name` places the binary
      # in the CWD (repo root). No --emit c / manual GCC needed.
      # -------------------------------------------------------
      - name: Build taupkg
        shell: bash
        run: |
          # Windows: link statically so the distributed taupkg.exe carries no MinGW
          # runtime DLL deps (libwinpthread-1.dll / libgcc_s / libstdc++) — those exist
          # on the build box but not on a clean Windows install, which otherwise fails
          # with "libwinpthread-1.dll was not found". On Linux/macOS a dynamic binary
          # against system libc is portable across distros, so no --static there
          # (static glibc + getpwuid/NSS is fragile and buys nothing here).
          STATIC=""
          case "${{ matrix.platform }}" in
            windows-*) STATIC="--static" ;;
          esac
          "$TAURAROC" src/main.tr -o "taupkg${{ matrix.ext }}" $STATIC
          echo "Built: taupkg${{ matrix.ext }} $STATIC"

      - name: Verify binary
        shell: bash
        run: |
          if [ -f "taupkg${{ matrix.ext }}" ]; then
            echo "Build succeeded: taupkg${{ matrix.ext }}"
            ls -lh "taupkg${{ matrix.ext }}"
            "./taupkg${{ matrix.ext }}" version
          else
            echo "error: taupkg${{ matrix.ext }} not produced"
            exit 1
          fi

      # -------------------------------------------------------
      # SHA256 checksum of the binary for this platform. Bundled
      # alongside the binary in the main artifact AND uploaded as its
      # own artifact so it can be downloaded standalone and pasted
      # into the release notes.
      # -------------------------------------------------------
      - name: Generate SHA256 checksum
        shell: bash
        run: |
          sha256sum "taupkg${{ matrix.ext }}" > "taupkg-${{ matrix.platform }}.sha256"
          cat "taupkg-${{ matrix.platform }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: taupkg-${{ matrix.platform }}
          path: |
            taupkg${{ matrix.ext }}
            taupkg-${{ matrix.platform }}.sha256

      - name: Upload SHA256 checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: taupkg-${{ matrix.platform }}-sha256
          if-no-files-found: error
          path: taupkg-${{ matrix.platform }}.sha256

  # -----------------------------------------------------------------
  # Termux / Android build: taupkg statically linked so it runs under
  # Termux's non-standard filesystem layout (everything under
  # /data/data/com.termux/files/usr). Plain `taupkg-linux-arm64` above
  # is architecture-correct (aarch64) but dynamically linked against
  # Ubuntu's own glibc/ld.so path (ELF PT_INTERP) — that path doesn't
  # exist under Termux, so it fails to load there even though the CPU
  # matches. Same root cause tauraro's own `build-termux-android` job
  # (tauraro/tauraro) exists to fix, but taupkg needs its own fix since
  # it's a separately-shipped binary.
  #
  # No special bootstrap compiler is needed: the *compiler* only runs
  # here on the ubuntu-22.04-arm CI runner (a normal Ubuntu box), so the
  # regular dynamically-linked `tauraroc-linux-arm64` release works fine
  # as the bootstrap. Only the *output* `taupkg` binary — the one that
  # actually ships to a Termux device — needs `--static`, exactly like
  # the existing windows-* case above.
  # -----------------------------------------------------------------
  build-termux-android:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout taupkg
        uses: actions/checkout@v4

      - name: Download latest tauraroc (linux-arm64 bootstrap)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP="tauraroc-linux-arm64.zip"

          TAG=$(gh release view \
                  --repo tauraro/tauraro \
                  --json tagName \
                  -q '.tagName' 2>/dev/null || true)

          if [ -z "$TAG" ]; then
            echo "error: could not determine latest tauraroc release tag"
            exit 1
          fi
          echo "Latest tauraroc: $TAG"

          mkdir -p tauraroc-dl/
          gh release download "$TAG" \
            --repo tauraro/tauraro \
            --pattern "$ZIP" \
            --dir tauraroc-dl/ \
            --clobber

          mkdir -p tauraroc-install/
          unzip -oq "tauraroc-dl/$ZIP" -d tauraroc-install/

          BIN=$(find tauraroc-install -name "tauraroc" ! -path "*/src/*" | head -1)
          if [ -z "$BIN" ]; then
            echo "error: tauraroc not found in $ZIP"
            exit 1
          fi
          chmod +x "$BIN"

          BIN_DIR=$(dirname "$BIN")
          echo "TAURAROC=$(pwd)/$BIN"                  >> "$GITHUB_ENV"
          echo "TAURAROC_RT=$(pwd)/$BIN_DIR/runtime"    >> "$GITHUB_ENV"
          echo "Using tauraroc: $(pwd)/$BIN"

      - name: Build taupkg (statically linked, for Termux)
        shell: bash
        run: |
          "$TAURAROC" src/main.tr -o taupkg --static
          echo "Built: taupkg --static"

      - name: Verify the binary is actually static (no dynamic-linker dependency)
        shell: bash
        run: |
          set -e
          file taupkg
          if ldd taupkg 2>&1 | grep -q "=>"; then
            echo "FAIL: taupkg is dynamically linked (found resolved .so dependencies)"
            ldd taupkg
            exit 1
          fi
          echo "OK: no dynamic dependencies — safe to run under Termux's own filesystem layout"
          ./taupkg version

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          sha256sum taupkg > taupkg-android-arm64.sha256
          cat taupkg-android-arm64.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: taupkg-android-arm64
          path: |
            taupkg
            taupkg-android-arm64.sha256

      - name: Upload SHA256 checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: taupkg-android-arm64-sha256
          if-no-files-found: error
          path: taupkg-android-arm64.sha256

  # -----------------------------------------------------------------
  # Release: runs only on v* tag pushes after all builds succeed.
  # Downloads each platform binary, zips it, creates a GitHub Release.
  # -----------------------------------------------------------------
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download linux-x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: taupkg-linux-x64
          path: release/linux-x64/

      - name: Download linux-arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: taupkg-linux-arm64
          path: release/linux-arm64/

      - name: Download windows-x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: taupkg-windows-x64
          path: release/windows-x64/

      - name: Download macos-arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: taupkg-macos-arm64
          path: release/macos-arm64/

      - name: Create release zips
        run: |
          mkdir -p release/assets
          zip -j release/assets/taupkg-linux-x64.zip   release/linux-x64/taupkg
          zip -j release/assets/taupkg-linux-arm64.zip release/linux-arm64/taupkg
          zip -j release/assets/taupkg-windows-x64.zip release/windows-x64/taupkg.exe
          zip -j release/assets/taupkg-macos-arm64.zip release/macos-arm64/taupkg

      # -------------------------------------------------------
      # Combined SHA256SUMS.txt: checksums of the release zips
      # (what users actually download) plus the raw per-platform
      # binary checksums produced during the build job.
      # -------------------------------------------------------
      - name: Generate combined SHA256SUMS.txt
        run: |
          cd release/assets
          sha256sum *.zip > SHA256SUMS.txt
          cd -
          echo "" >> release/assets/SHA256SUMS.txt
          echo "# Per-platform binary checksums (uncompressed):" >> release/assets/SHA256SUMS.txt
          cat release/linux-x64/taupkg-linux-x64.sha256     >> release/assets/SHA256SUMS.txt
          cat release/linux-arm64/taupkg-linux-arm64.sha256 >> release/assets/SHA256SUMS.txt
          cat release/windows-x64/taupkg-windows-x64.sha256 >> release/assets/SHA256SUMS.txt
          cat release/macos-arm64/taupkg-macos-arm64.sha256 >> release/assets/SHA256SUMS.txt
          cat release/assets/SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "taupkg ${{ github.ref_name }}" \
            --generate-notes \
            release/assets/taupkg-linux-x64.zip \
            release/assets/taupkg-linux-arm64.zip \
            release/assets/taupkg-windows-x64.zip \
            release/assets/taupkg-macos-arm64.zip \
            release/assets/SHA256SUMS.txt
